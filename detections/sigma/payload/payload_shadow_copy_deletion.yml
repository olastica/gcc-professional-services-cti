title: Shadow Copy Deletion via vssadmin (Payload and Other Ransomware)
id: b4214064-d443-4aad-a8fc-d919df3cbb43
status: experimental
description: |
  Generic catch for "vssadmin delete shadows /all /quiet", used by Payload and many other ransomware families
  to stop victims restoring from Volume Shadow Copies. Broader than the "--background" rule.
references:
  - https://www.nopalcyber.com/threat-hunting-advisory/may-28th,-2026
author: Olasunkanmi Ogidan
date: 2026-11-22
tags:
  - attack.impact
  - attack.t1490
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains|all:
      - 'vssadmin'
      - 'delete'
      - 'shadows'
      - '/all'
  condition: selection
falsepositives:
  - Rare backup/admin maintenance scripts (verify with IT)
level: high
