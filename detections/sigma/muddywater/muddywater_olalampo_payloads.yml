title: MuddyWater Olalampo - Payload Dropped to Known Staging/Persistence Path
id: f2d4e540-1ada-4876-b81a-837406d8a22d
status: experimental
description: |
  File creation in paths used by Operation Olalampo malware:
  - GhostFetch persistence: %LOCALAPPDATA%\Microsoft\Windows\BurnUtill\burn.exe (note misspelling "BurnUtill"; VT sandbox)
  - GhostFetch dropper: C:\Users\Public\Documents\MicrosoftExcelUser.exe (Group-IB)
  - CHAR dropper: C:\Users\Public\Downloads\novaservice.exe (Group-IB)
  - HTTP_VIP dropper: MicrosoftWordUser.exe / pic.LOG (Group-IB)
  - HTTP_VIP staging folder: %USERPROFILE%\AppData\SystemApps\ (VT sandbox; SysTemp.exe from automated analysis - unverified)
references:
  - https://group-ib.com/blog/muddywater-operation-olalampo
  - https://www.virustotal.com/gui/file/8d2227f2c53d7e22a57e12c45cecdd43dbec08dbc3ab93e74e6df52cdf80548b/behavior
author: Olasunkanmi Ogidan
date: 2026-11-22
tags:
  - attack.persistence
  - attack.t1547.001
  - attack.execution
  - attack.t1204.002
logsource:
  product: windows
  category: file_event
detection:
  selection_burn:
    TargetFilename|contains: '\AppData\Local\Microsoft\Windows\BurnUtill\'
  selection_public:
    TargetFilename|endswith:
      - '\Users\Public\Documents\MicrosoftExcelUser.exe'
      - '\Users\Public\Downloads\novaservice.exe'
      - '\MicrosoftWordUser.exe'
  selection_systemapps:
    TargetFilename|contains: '\AppData\SystemApps\'
  condition: 1 of selection_*
falsepositives:
  - None expected
level: critical
