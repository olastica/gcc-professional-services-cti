title: MuddyWater Olalampo - Executable Launched From Payload Path or With .log Extension
id: ed62d9cf-ca7b-430c-a96a-e83191508c3d
status: experimental
description: |
  Process start from Olalampo payload paths, or a process image ending in ".log" (HTTP_VIP is dropped and run as pic.LOG).
  Windows will execute a PE regardless of extension; a running ".log" file is a strong masquerading signal.
references:
  - https://group-ib.com/blog/muddywater-operation-olalampo
author: Olasunkanmi Ogidan
date: 2026-11-22
tags:
  - attack.execution
  - attack.t1204.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_paths:
    Image|contains:
      - '\AppData\Local\Microsoft\Windows\BurnUtill\'
      - '\AppData\SystemApps\'
  selection_names:
    Image|endswith:
      - '\Users\Public\Documents\MicrosoftExcelUser.exe'
      - '\Users\Public\Downloads\novaservice.exe'
      - '\MicrosoftWordUser.exe'
  selection_log:
    Image|endswith: '.log'
  condition: 1 of selection_*
falsepositives:
  - None expected
level: critical
