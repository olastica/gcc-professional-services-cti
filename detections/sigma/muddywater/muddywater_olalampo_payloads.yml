title: MuddyWater Olalampo - Office Application Spawns Process From Public or AppData Folder
id: 788f57a3-1434-45c9-9469-92765fc76730
status: experimental
description: |
  Olalampo macros (Workbook_Open) decode a payload from a hidden form control, write it to C:\Users\Public\... or the
  user profile, and execute it. Word/Excel launching an executable from these folders is highly suspicious.
references:
  - https://group-ib.com/blog/muddywater-operation-olalampo
author: Olasunkanmi Ogidan
date: 2026-11-22
tags:
  - attack.initial-access
  - attack.t1566.001
  - attack.execution
  - attack.t1204.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
  selection_child:
    Image|contains:
      - '\Users\Public\'
      - '\AppData\SystemApps\'
      - '\AppData\Local\Microsoft\Windows\BurnUtill\'
  condition: all of selection_*
falsepositives:
  - Rare legitimate macros launching tools from Public folders
level: high
