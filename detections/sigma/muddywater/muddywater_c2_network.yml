title: MuddyWater Olalampo - DNS Query to Known C2 Domain
id: 1eddb10d-eafd-430c-9cb0-9330f3fb3c88
status: experimental
description: |
  DNS lookups for validated Operation Olalampo C2 domains. codefusiontech[.]org and promoverse[.]org were active as of Nov 2026;
  miniquest[.]org (suspended Feb 2026) and jerusalemsolutions[.]com (expired/parked Oct 2026) are kept for retro-hunting.
references:
  - https://group-ib.com/blog/muddywater-operation-olalampo
author: Olasunkanmi Ogidan
date: 2026-11-22
tags:
  - attack.command-and-control
  - attack.t1071.001
logsource:
  product: windows
  category: dns_query   # Sysmon EID 22 / Defender DeviceEvents DnsQueryResponse
detection:
  selection:
    QueryName|endswith:
      - 'codefusiontech.org'
      - 'promoverse.org'
      - 'miniquest.org'
      - 'jerusalemsolutions.com'
  condition: selection
falsepositives:
  - None expected
level: critical
