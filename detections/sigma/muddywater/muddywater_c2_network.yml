title: MuddyWater Olalampo - C2 URL Paths in Proxy Logs
id: 01ce12f7-7256-41df-87dd-b5c1a076447d
status: experimental
description: |
  C2 URI paths observed in VirusTotal relations for validated samples: GhostFetch (/api/debut, /api/authentification/connexion,
  /api/accueil/etat on promoverse) and HTTP_VIP (/postinfo, /content?id= on codefusiontech). Requires proxy logs with TLS inspection.
  Paths are only matched together with the C2 host to avoid false positives on generic words.
references:
  - https://www.virustotal.com/gui/file/8d2227f2c53d7e22a57e12c45cecdd43dbec08dbc3ab93e74e6df52cdf80548b/relations
  - https://www.virustotal.com/gui/file/1b9e6fe4b03285b2e768c57e320d84323ac9167598395918d56a12e568b0009a/relations
author: Olasunkanmi Ogidan
date: 2026-11-22
tags:
  - attack.command-and-control
  - attack.t1071.001
logsource:
  category: proxy
detection:
  selection_host:
    cs-host|endswith:
      - 'promoverse.org'
      - 'codefusiontech.org'
  selection_path:
    c-uri|contains:
      - '/api/debut'
      - '/api/authentification/connexion'
      - '/api/accueil/etat'
      - '/postinfo'
      - '/content?id='
      - '/FMAPP.dll'
  condition: all of selection_*
falsepositives:
  - None expected
level: critical
