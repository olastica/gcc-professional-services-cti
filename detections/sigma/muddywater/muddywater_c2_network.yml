title: Telegram Bot API Accessed by Non-Browser Process (CHAR Backdoor Pattern)
id: 587eb1b0-0a01-4f4f-b0b8-c3426040da78
status: experimental
description: |
  MuddyWater's CHAR backdoor (Rust) uses a Telegram bot as C2. A non-browser, non-Telegram process resolving api.telegram.org
  is a strong hunting signal in a corporate environment.
references:
  - https://group-ib.com/blog/muddywater-operation-olalampo
author: Olasunkanmi Ogidan
date: 2026-11-22
tags:
  - attack.command-and-control
  - attack.t1102.002
logsource:
  product: windows
  category: dns_query
detection:
  selection:
    QueryName: 'api.telegram.org'
  filter_browsers:
    Image|endswith:
      - '\chrome.exe'
      - '\msedge.exe'
      - '\firefox.exe'
      - '\Telegram.exe'
  condition: selection and not filter_browsers
falsepositives:
  - Approved automation/bots using Telegram (should be rare in a professional services firm)
level: high
