title: MuddyWater - GhostBackDoor MicrosoftVersionUpdater Service Created
id: 541895e3-75e8-4bb1-8f74-52c4687b5cdc
status: experimental
description: GhostBackDoor installs itself as the service "MicrosoftVersionUpdater" when it has admin rights (Group-IB). Detected via the service registry key.
references:
  - https://group-ib.com/blog/muddywater-operation-olalampo
author: Olasunkanmi Ogidan
date: 2026-11-22
tags:
  - attack.persistence
  - attack.t1543.003
logsource:
  product: windows
  category: registry_set
detection:
  selection:
    TargetObject|contains: '\SYSTEM\CurrentControlSet\Services\MicrosoftVersionUpdater'
  condition: selection
falsepositives:
  - None expected (no legitimate Microsoft service by this name)
level: critical
