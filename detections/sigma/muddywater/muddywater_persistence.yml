title: MuddyWater - User Shell Folders Startup Path Modified
id: 92a18ec6-795c-4b9f-92ee-25940fba959c
status: experimental
description: |
  GhostFetch sibling build (SHA-256 3a19c19d9f3bac6628a968110477ee01e5867b2534e914e1be5c4485947bd819) persists by changing the
  per-user Startup folder value so its payload launches at logon. Also matched by VT's crowdsourced Sigma rule
  "Modify User Shell Folders Startup Value" (frack113).
references:
  - https://www.virustotal.com/gui/file/3a19c19d9f3bac6628a968110477ee01e5867b2534e914e1be5c4485947bd819/behavior
author: Olasunkanmi Ogidan
date: 2026-11-22
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  product: windows
  category: registry_set
detection:
  selection:
    TargetObject|endswith: '\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders\Startup'
  condition: selection
falsepositives:
  - Folder redirection via Group Policy / OneDrive Known Folder Move (tune by process)
level: high
