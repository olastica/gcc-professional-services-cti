title: MuddyWater - DailyUpdate Scheduled Task for CHAR Backdoor
id: fb691629-ba6d-413d-8630-fe46e158a78b
status: experimental
description: Group-IB observed operators creating a daily scheduled task named "DailyUpdate" that runs novaservice.exe (CHAR backdoor).
references:
  - https://group-ib.com/blog/muddywater-operation-olalampo
author: Olasunkanmi Ogidan
date: 2026-11-22
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_task:
    CommandLine|contains: 'DailyUpdate'
  selection_payload:
    CommandLine|contains: 'novaservice'
  condition: all of selection_*
falsepositives:
  - None expected
level: critical
