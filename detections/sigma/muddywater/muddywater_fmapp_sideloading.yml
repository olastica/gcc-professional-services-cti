title: MuddyWater - FMAPP.exe Executed From User-Writable Location
id: be390fef-9b6c-460d-bb35-ba6dc8c3ed10
status: experimental
description: |
  FMAPP.exe running from a user-writable folder (Users, ProgramData, Temp) indicates it was copied there to sideload
  a malicious FMAPP.dll. Group-IB observed operators launching FMAPP.exe via encoded PowerShell sent over Telegram.
references:
  - https://group-ib.com/blog/muddywater-operation-olalampo
author: Olasunkanmi Ogidan
date: 2026-11-22
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1574.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\FMAPP.exe'
    Image|contains:
      - '\Users\'
      - '\ProgramData\'
      - '\Temp\'
  condition: selection
falsepositives:
  - Unlikely
level: high
