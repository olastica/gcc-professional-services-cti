title: Remote Access / File Transfer Tool Execution (AnyDesk, WinSCP) - Gentlemen TTP
id: 98e30ea3-7aae-465f-a15a-c9ab90dc00ba
status: experimental
description: |
  The Gentlemen affiliates use AnyDesk for persistence and WinSCP for encrypted data exfiltration.
  Alerts on execution of either tool. Tune with an allowlist if IT legitimately uses them.
references:
  - https://www.trendmicro.com/en_gb/research/25/i/unmasking-the-gentlemen-ransomware.html
author: Olasunkanmi Ogidan
date: 2026-11-21
tags:
  - attack.command-and-control
  - attack.t1219
  - attack.exfiltration
  - attack.t1048
logsource:
  product: windows
  category: process_creation
detection:
  selection_anydesk:
    - Image|endswith: '\AnyDesk.exe'
    - Description: 'AnyDesk'
    - Product: 'AnyDesk'
  selection_winscp:
    - Image|endswith:
        - '\WinSCP.exe'
        - '\WinSCP.com'
    - Product: 'WinSCP'
  filter_approved:
    User|contains: '<APPROVED_IT_ACCOUNT>'   # replace or remove
  condition: 1 of selection_* and not filter_approved
falsepositives:
  - Approved IT remote support or file transfer
level: medium
