title: The Gentlemen Ransomware - gentlemen_system Scheduled Task Created (Event 4698)
id: 3f0eff16-e304-41a8-b1c4-88dd29662436
status: experimental
description: Catches the task even if created via API rather than schtasks.exe. Requires "Audit Other Object Access Events".
references:
  - https://www.microsoft.com/en-us/security/blog/?p=147677
author: Olasunkanmi Ogidan
date: 2026-11-21
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4698
    TaskName|contains: 'gentlemen_system'
  condition: selection
falsepositives:
  - None expected
level: critical
